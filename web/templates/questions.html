{% extends "base.html" %}
{% block title %}Questions · MELE Review{% endblock %}
{% block content %}
<div class="container">
  <div class="q-toolbar">
    <input type="text" id="q-search" placeholder="Search questions...">
    <select id="q-tag"><option value="">All tags</option></select>
    <label class="toggle"><input type="checkbox" id="q-inactive"> Show hidden</label>
    <span id="q-count" class="muted"></span>
  </div>
  <div id="q-list" class="q-list"></div>
  <div id="q-loading" class="muted">Loading...</div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/questions.js?v=2"></script>
{% endblock %}
