{% extends "base.html" %}
{% block title %}Profile · MELE Review{% endblock %}
{% block content %}
<style>
  .profile-container {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 2rem;
    max-width: 1100px;
    margin: 0 auto;
    padding: 2rem;
  }
  @media (max-width: 720px) {
    .profile-container {
      grid-template-columns: 1fr;
    }
  }
  .profile-card {
    background: var(--panel);
    border: 2px solid var(--border-color);
    border-radius: 4px;
    box-shadow: 4px 4px 0 var(--border-color);
    padding: 1.5rem;
    position: sticky;
    top: 2rem;
  }
  .profile-avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: var(--accent);
    color: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 2rem;
    margin: 0 auto 1rem;
    border: 2px solid var(--border-color);
    box-shadow: 2px 2px 0 var(--border-color);
  }
  .profile-name {
    text-align: center;
    font-size: 1.3rem;
    margin: 0 0 0.25rem;
    color: var(--text);
  }
  .profile-joined {
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 1.5rem;
  }
  .profile-stats {
    display: flex;
    justify-content: space-around;
    margin-bottom: 1.5rem;
    padding: 0.75rem 0;
    border-top: 1px solid var(--border-color);
    border-bottom: 1px solid var(--border-color);
  }
  .stat-item {
    text-align: center;
  }
  .stat-value {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--accent);
  }
  .stat-label {
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .section-title {
    font-size: 0.85rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 1.25rem 0 0.75rem;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 0.25rem;
  }
  .pin-form {
    display: flex;
    gap: 0.5rem;
  }
  .pin-form input {
    flex: 1;
    padding: 0.5rem;
    background: var(--bg);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    color: var(--text);
    font-size: 0.9rem;
  }
  .pin-form button {
    padding: 0.5rem 0.75rem;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .pin-form button:hover {
    background: #4ade80;
  }
  .profile-actions {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    margin-top: 1.25rem;
  }
  .btn-danger {
    background: var(--danger);
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 0.6rem;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
  }
  .btn-danger:hover {
    background: #ef4444;
  }
  .btn-secondary {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    padding: 0.6rem;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
  }
  .btn-secondary:hover {
    background: var(--bg);
  }
  .questions-section {
    min-height: 0;
  }
  .questions-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
  }
  .questions-header h2 {
    margin: 0;
    font-size: 1.2rem;
    color: var(--text);
  }
  .questions-list {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  .question-item {
    background: var(--panel);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    padding: 1rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: border-color 0.15s;
  }
  .question-item:hover {
    border-color: var(--accent);
  }
  .question-text {
    flex: 1;
    margin-right: 1rem;
    font-size: 0.95rem;
    color: var(--text);
    line-height: 1.4;
  }
  .question-meta {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-shrink: 0;
  }
  .question-tag {
    background: #1d2333;
    color: var(--accent);
    border-radius: 20px;
    padding: 0.15rem 0.5rem;
    font-size: 0.7rem;
  }
  .question-edit {
    color: var(--accent);
    font-size: 0.8rem;
    text-decoration: none;
    font-weight: 600;
  }
  .question-edit:hover {
    text-decoration: underline;
  }
  .empty-questions {
    color: var(--muted);
    text-align: center;
    padding: 3rem 1rem;
    background: var(--panel);
    border: 1px dashed var(--border-color);
    border-radius: 4px;
  }
  .empty-questions p {
    margin: 0 0 0.5rem;
  }
  .empty-questions a {
    color: var(--accent);
    font-weight: 600;
  }
  #pin-message {
    font-size: 0.8rem;
    margin-top: 0.5rem;
    min-height: 1.2em;
  }
  .pin-message.error {
    color: var(--danger);
  }
  .pin-message.success {
    color: var(--ok);
  }
</style>

<div class="profile-container" id="profile-page">
  <aside class="profile-card">
    <div class="profile-avatar" id="avatar"></div>
    <h1 class="profile-name" id="name"></h1>
    <div class="profile-joined" id="joined"></div>

    <div class="profile-stats">
      <div class="stat-item">
        <div class="stat-value" id="stat-answers">-</div>
        <div class="stat-label">Answers</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="stat-questions">-</div>
        <div class="stat-label">Questions</div>
      </div>
    </div>

    <div class="section-title">Change PIN</div>
    <form class="pin-form" id="pin-form">
      <input type="password" id="new-pin" placeholder="New PIN" required autocomplete="new-password">
      <button type="submit">Set</button>
    </form>
    <div id="pin-message"></div>

    <div class="profile-actions">
      <button class="btn-danger" id="delete-btn">Delete Account</button>
      <button class="btn-secondary" id="logout-btn">Logout</button>
    </div>
  </aside>

  <section class="questions-section">
    <div class="questions-header">
      <h2>My Questions</h2>
      <a href="/questions/new" class="btn btn-sm" style="background:var(--accent);color:#000;">+ New</a>
    </div>
    <div class="questions-list" id="questions-list">
      <div class="empty-questions" id="empty-state">
        <p>You haven't created any questions yet.</p>
        <a href="/questions/new">Create your first question</a>
      </div>
    </div>
  </section>
</div>

<script>
  async function loadProfile() {
    await refreshLogin();
    if (!window.currentUser) {
      location.href = "/login";
      return;
    }
    const u = window.currentUser;
    document.getElementById("avatar").textContent = u.name[0].toUpperCase();
    document.getElementById("name").textContent = u.name;
    document.getElementById("joined").textContent = "Member since " + new Date(u.date_created).toLocaleDateString();

    // Load stats
    const [solutionsRes, questionsRes] = await Promise.all([
      api("/api/my/solutions", {}, true),
      api("/api/questions", {}, true)
    ]);

    if (solutionsRes.ok) {
      const solutions = await solutionsRes.json();
      document.getElementById("stat-answers").textContent = solutions.length;
    }

    if (questionsRes.ok) {
      const allQuestions = await questionsRes.json();
      const myQuestions = allQuestions.filter(q => q.account_id === u.id);
      document.getElementById("stat-questions").textContent = myQuestions.length;
      renderQuestions(myQuestions);
    }
  }

  function renderQuestions(questions) {
    const list = document.getElementById("questions-list");
    const empty = document.getElementById("empty-state");
    if (questions.length === 0) {
      empty.hidden = false;
      return;
    }
    empty.hidden = true;
    list.innerHTML = "";
    for (const q of questions) {
      const item = document.createElement("div");
      item.className = "question-item";
      const text = q.question_text.length > 120 ? q.question_text.slice(0, 120) + "…" : q.question_text;
      item.innerHTML = `
        <div class="question-text">${escapeHtml(text)}</div>
        <div class="question-meta">
          ${q.tags.slice(0, 2).map(t => `<span class="question-tag">${escapeHtml(t)}</span>`).join("")}
          <a href="/questions/${q.id}/edit" class="question-edit">Edit</a>
        </div>
      `;
      list.appendChild(item);
    }
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }

  document.addEventListener("DOMContentLoaded", () => {
    loadProfile();

    // Change PIN
    document.getElementById("pin-form").addEventListener("submit", async e => {
      e.preventDefault();
      const msg = document.getElementById("pin-message");
      const pin = document.getElementById("new-pin").value;
      msg.className = "";
      msg.textContent = "";
      // Placeholder: no backend endpoint yet
      msg.className = "pin-message error";
      msg.textContent = "PIN change not implemented yet";
      document.getElementById("new-pin").value = "";
    });

    // Delete account
    document.getElementById("delete-btn").addEventListener("click", async () => {
      if (!confirm("Are you sure you want to delete your account? This cannot be undone.")) return;
      const res = await api("/api/auth/me", { method: "DELETE" });
      if (res.ok || res.status === 204) {
        await api("/api/auth/logout", { method: "POST" }, true);
        window.currentUser = null;
        setNavAccount(null);
        location.href = "/";
      } else {
        alert("Failed to delete account.");
      }
    });

    // Logout
    document.getElementById("logout-btn").addEventListener("click", async () => {
      await api("/api/auth/logout", { method: "POST" }, true);
      window.currentUser = null;
      setNavAccount(null);
      location.href = "/";
    });
  });
</script>
{% endblock %}
