{% extends "base.html" %}
{% block title %}Profile · MELE Review{% endblock %}
{% block content %}
<div class="profile-container" id="profile-page">
  <aside class="profile-card">
    <div class="profile-avatar" id="avatar"></div>
    <h1 class="profile-name" id="name"></h1>
    <div class="profile-joined" id="joined"></div>

    <div class="profile-stats">
      <div class="stat-item">
        <div class="stat-value" id="stat-answers">-</div>
        <div class="stat-label">Answers</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="stat-questions">-</div>
        <div class="stat-label">Questions</div>
      </div>
    </div>

    <div class="section-title">Change PIN</div>
    <form class="pin-form" id="pin-form">
      <input type="password" id="new-pin" placeholder="New PIN" required autocomplete="new-password">
      <button type="submit">Set</button>
    </form>
    <div id="pin-message"></div>

    <div class="profile-actions">
      <button class="btn-danger" id="delete-btn">Delete Account</button>
      <button class="btn-secondary" id="logout-btn">Logout</button>
    </div>
  </aside>

  <section class="questions-section">
    <div class="questions-header">
      <h2>My Questions</h2>
      <a href="/questions/new" class="btn btn-primary btn-sm">+ New</a>
    </div>
    <div class="questions-list" id="questions-list">
      <div class="empty-questions" id="empty-state">
        <p>You haven't created any questions yet.</p>
        <a href="/questions/new">Create your first question</a>
      </div>
    </div>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/profile.js"></script>
{% endblock %}
