<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MELE Review{% endblock %}</title>
    <link rel="preconnect" href="https://cdn.projectnova.download" crossorigin>
    <link rel="stylesheet" href="https://cdn.projectnova.download/flat/dark/theme.css?v=7">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="/static/css/tailwind.css?v=1">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@desmos-community/mathquill@2026.8.7/dist/style.css" integrity="sha384-fixDVDYhBbhyEIAWhV0Csc56CLD5uCUsFp1FQVOAMeb1FBQffC11Q/vqF2UEraWs" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/@desmos-community/mathquill@2026.8.7/dist/index.global.js" integrity="sha384-eiP9cXJnn3GiumpqWJW4kJ+Z6e3Cu3mrrkU54r99W3wKz17f3L88EyZPARPmr/bm" crossorigin="anonymous"></script>
    {% block head %}{% endblock %}
    <script src="https://cdn.projectnova.download/shell.js"></script>

</head>
<body>
    <nav class="ui-navbar">
  <div class="ui-navbar__inner">
    <span class="ui-navbar__lead" aria-hidden="true"></span>
    <a class="ui-navbar__brand" href="/">~/<span>melereview</span></a>
    <div class="ui-navbar__right">
      <ul class="ui-navbar__links">
          <li><a class="ui-navbar__link" href="/questions">Questions</a></li>
          <li><a class="ui-navbar__link" href="/calculators">Calculators</a></li>
          
          <li><a href="/login" id="nav-login-btn" class="ui-navbar__link">Login</a></li>
          <li><a href="/profile" id="nav-profile-btn" class="ui-navbar__link nav-profile" hidden><span class="nav-avatar" id="nav-avatar"></span><span id="nav-account-name"></span></a></li>
          <li><button id="nav-logout-btn" class="ui-navbar__link" title="Logout" hidden>&#9211;</button></li>
        </ul>
      <button class="ui-theme-toggle" aria-label="Toggle light/dark"></button>
    </div>
  </div>
</nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script>
      const ACCOUNT_KEY = "melereview_account";
      window.currentUser = null;
      async function api(path, opts, allowAnon = false) {
        const res = await fetch(path, { credentials: "include", ...opts });
        if (!allowAnon && res.status === 401) { location.href = "/"; throw new Error("unauthorized"); }
        return res;
      }
      function setNavAccount(name) {
        const loginBtn = document.getElementById("nav-login-btn");
        const profileBtn = document.getElementById("nav-profile-btn");
        const avatar = document.getElementById("nav-avatar");
        const nameEl = document.getElementById("nav-account-name");
        const logoutBtn = document.getElementById("nav-logout-btn");
        if (name) {
          avatar.textContent = name[0].toUpperCase();
          nameEl.textContent = name;
          profileBtn.hidden = false;
          logoutBtn.hidden = false;
          loginBtn.hidden = true;
        } else {
          profileBtn.hidden = true;
          logoutBtn.hidden = true;
          loginBtn.hidden = false;
        }
      }
      async function refreshLogin() {
        const res = await api("/api/auth/me", {}, true);
        if (res.ok) {
          const me = await res.json();
          window.currentUser = me;
          setNavAccount(me.name);
          sessionStorage.setItem(ACCOUNT_KEY, JSON.stringify(me));
        } else {
          window.currentUser = null;
          setNavAccount(null);
        }
      }
      function escapeHtml(s) {
        return s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
      }
      async function logout() {
        await fetch("/api/auth/logout", { method: "POST", credentials: "include" });
        window.currentUser = null;
        setNavAccount(null);
        location.href = "/";
      }
      document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("nav-logout-btn").addEventListener("click", () => logout());
      });
      // Theme-dependent charts re-render when the shared switch flips <html data-theme>.
      new MutationObserver(() => {
        document.dispatchEvent(new CustomEvent("themeChanged", {
          detail: { theme: document.documentElement.dataset.theme === "light" ? "light" : "dark" },
        }));
      }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
    </script>
    <script src="/static/js/error.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
