<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MELE Review{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/main.css?v=3">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="topnav">
        <a class="brand" href="/">MELE Review</a>
        <div class="nav-links">
            <a href="/questions">Questions</a>
            <a href="/calculators">Calculators</a>
        </div>
        <div class="nav-right">
            <button id="dark-mode-toggle" class="btn btn-icon" title="Toggle dark mode">☀</button>
            <div id="nav-logged-out">
                <a href="/login" class="btn btn-secondary btn-sm">Login</a>
            </div>
            <div id="nav-logged-in" hidden>
                <span id="nav-account-name"></span>
                <a href="/profile" class="btn btn-secondary btn-sm">Profile</a>
            </div>
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script>
      const ACCOUNT_KEY = "melereview_account";
      window.currentUser = null;
      async function api(path, opts, allowAnon = false) {
        const res = await fetch(path, { credentials: "include", ...opts });
        if (!allowAnon && res.status === 401) { location.href = "/"; throw new Error("unauthorized"); }
        return res;
      }
      function setNavAccount(name) {
        const loggedOut = document.getElementById("nav-logged-out");
        const loggedIn = document.getElementById("nav-logged-in");
        if (name) {
          document.getElementById("nav-account-name").textContent = name;
          loggedIn.hidden = false;
          loggedOut.hidden = true;
        } else {
          loggedIn.hidden = true;
          loggedOut.hidden = false;
        }
      }
      async function refreshLogin() {
        const res = await api("/api/auth/me", {}, true);
        if (res.ok) {
          const me = await res.json();
          window.currentUser = me;
          setNavAccount(me.name);
          sessionStorage.setItem(ACCOUNT_KEY, JSON.stringify(me));
        } else {
          window.currentUser = null;
          setNavAccount(null);
        }
      }
      function applyTheme(theme) {
        document.body.classList.remove("theme-neo-light", "theme-neo-dark");
        document.body.classList.add(theme);
        const btn = document.getElementById("dark-mode-toggle");
        btn.textContent = theme === "theme-neo-dark" ? "☀" : "☾";
        localStorage.setItem("meler_theme", theme);
      }
      document.addEventListener("DOMContentLoaded", () => {
        refreshLogin();
        const saved = localStorage.getItem("meler_theme") || "theme-neo-dark";
        applyTheme(saved);
        document.getElementById("dark-mode-toggle").addEventListener("click", () => {
          const next = document.body.classList.contains("theme-neo-dark") ? "theme-neo-light" : "theme-neo-dark";
          applyTheme(next);
        });
      });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
