<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MELE Review{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/main.css">
    {% block head %}{% endblock %}
</head>
<body><script>document.body.className=localStorage.getItem("meler_theme")||"theme-neo-dark"</script>
    <nav class="topnav">
        <a class="brand" href="/">MELE Review</a>
        <div class="nav-links">
            <a href="/questions">Questions</a>
            <a href="/calculators">Calculators</a>
        </div>
        <div class="nav-right">
            <label class="theme-switch">
                <input type="checkbox" id="dark-mode-toggle">
                <span class="theme-switch-track"><span class="theme-switch-knob"></span></span>
            </label>
            <a href="/login" id="nav-login-btn" class="btn btn-secondary btn-sm">Login</a>
            <a href="/profile" id="nav-profile-btn" class="btn btn-secondary btn-sm nav-profile" hidden>
                <span class="nav-avatar" id="nav-avatar"></span>
                <span id="nav-account-name"></span>
            </a>
            <button id="nav-logout-btn" class="btn btn-icon" title="Logout" hidden>⏻</button>
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script>
      const ACCOUNT_KEY = "melereview_account";
      window.currentUser = null;
      async function api(path, opts, allowAnon = false) {
        const res = await fetch(path, { credentials: "include", ...opts });
        if (!allowAnon && res.status === 401) { location.href = "/"; throw new Error("unauthorized"); }
        return res;
      }
      function setNavAccount(name) {
        const loginBtn = document.getElementById("nav-login-btn");
        const profileBtn = document.getElementById("nav-profile-btn");
        const avatar = document.getElementById("nav-avatar");
        const nameEl = document.getElementById("nav-account-name");
        const logoutBtn = document.getElementById("nav-logout-btn");
        if (name) {
          avatar.textContent = name[0].toUpperCase();
          nameEl.textContent = name;
          profileBtn.hidden = false;
          logoutBtn.hidden = false;
          loginBtn.hidden = true;
        } else {
          profileBtn.hidden = true;
          logoutBtn.hidden = true;
          loginBtn.hidden = false;
        }
      }
      async function refreshLogin() {
        const res = await api("/api/auth/me", {}, true);
        if (res.ok) {
          const me = await res.json();
          window.currentUser = me;
          setNavAccount(me.name);
          sessionStorage.setItem(ACCOUNT_KEY, JSON.stringify(me));
        } else {
          window.currentUser = null;
          setNavAccount(null);
        }
      }
      function applyTheme(theme) {
        document.body.classList.remove("theme-neo-light", "theme-neo-dark");
        document.body.classList.add(theme);
        const toggle = document.getElementById("dark-mode-toggle");
        toggle.checked = theme === "theme-neo-dark";
        localStorage.setItem("meler_theme", theme);
        document.dispatchEvent(new CustomEvent("themeChanged", { detail: { theme } }));
      }
      function escapeHtml(s) {
        return s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
      }
      async function logout() {
        await fetch("/api/auth/logout", { method: "POST", credentials: "include" });
        window.currentUser = null;
        setNavAccount(null);
        location.href = "/";
      }
      document.addEventListener("DOMContentLoaded", () => {
        const saved = localStorage.getItem("meler_theme") || "theme-neo-dark";
        applyTheme(saved);
        document.getElementById("nav-logout-btn").addEventListener("click", () => logout());
        document.getElementById("dark-mode-toggle").addEventListener("change", () => {
          const next = document.body.classList.contains("theme-neo-dark") ? "theme-neo-light" : "theme-neo-dark";
          localStorage.setItem("meler_theme", next);
          applyTheme(next);
        });
      });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
