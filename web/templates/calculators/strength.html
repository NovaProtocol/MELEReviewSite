{% extends "base.html" %}
{% block title %}Strength of Materials · MELE Review{% endblock %}
{% block content %}
<div class="container narrow">
  <a href="/calculators" class="back-link">&larr; Calculators</a>
  <h1>Strength of Materials</h1>

  <h3>Axial Stress / Strain</h3>
  <div class="row2">
    <div class="form-group"><label>Force P (N)</label><input type="number" id="s-f" step="any" value="10000"></div>
    <div class="form-group"><label>Area A (mm²)</label><input type="number" id="s-a" step="any" value="200"></div>
  </div>
  <div class="row2">
    <div class="form-group"><label>Length L (mm)</label><input type="number" id="s-l" step="any" value="1000"></div>
    <div class="form-group"><label>E (GPa, steel ≈ 200)</label><input type="number" id="s-e" step="any" value="200"></div>
  </div>
  <button id="s-axial" class="btn">Compute</button>
  <div class="result-box" id="s-axial-out"></div>

  <h3>Simply Supported Beam — center load</h3>
  <div class="row2">
    <div class="form-group"><label>Span L (m)</label><input type="number" id="b-l" step="any" value="4"></div>
    <div class="form-group"><label>Center load P (kN)</label><input type="number" id="b-p" step="any" value="20"></div>
  </div>
  <div class="row2">
    <div class="form-group"><label>E (GPa)</label><input type="number" id="b-e" step="any" value="200"></div>
    <div class="form-group"><label>I (×10⁶ mm⁴)</label><input type="number" id="b-i" step="any" value="50"></div>
  </div>
  <button id="b-beam" class="btn">Compute</button>
  <div class="result-box" id="b-beam-out"></div>

  <h3>Shaft Torsion</h3>
  <div class="row2">
    <div class="form-group"><label>Torque T (N·m)</label><input type="number" id="t-t" step="any" value="500"></div>
    <div class="form-group"><label>Shaft diameter d (mm)</label><input type="number" id="t-d" step="any" value="40"></div>
  </div>
  <div class="row2">
    <div class="form-group"><label>Length L (mm)</label><input type="number" id="t-l" step="any" value="500"></div>
    <div class="form-group"><label>G (GPa, steel ≈ 79)</label><input type="number" id="t-g" step="any" value="79"></div>
  </div>
  <button id="t-torsion" class="btn">Compute</button>
  <div class="result-box" id="t-torsion-out"></div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/calculators/strength.js"></script>
{% endblock %}
