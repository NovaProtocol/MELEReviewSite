{% extends "base.html" %}
{% block title %}Psychrometrics · MELE Review{% endblock %}
{% block content %}
<div class="container narrow">
  <a href="/calculators" class="back-link">&larr; Calculators</a>
  <h1>Psychrometrics</h1>
  <div class="row2">
    <div class="form-group"><label>Dry-bulb temp T (°C)</label><input type="number" id="p-t" step="any" value="30"></div>
    <div class="form-group"><label>Relative humidity RH (%)</label><input type="number" id="p-rh" step="any" value="60"></div>
  </div>
  <div class="form-group"><label>Pressure (kPa, ≈101.325)</label><input type="number" id="p-p" step="any" value="101.325"></div>
  <button id="p-calc" class="btn">Compute</button>
  <div class="result-box" id="p-result"></div>

  <h3>Mixing two air streams</h3>
  <div class="row2">
    <div class="form-group"><label>Stream 1: m₁ (kg/s), T₁ (°C)</label><input type="text" id="m1" value="2, 25"></div>
    <div class="form-group"><label>Stream 2: m₂ (kg/s), T₂ (°C)</label><input type="text" id="m2" value="3, 35"></div>
  </div>
  <button id="p-mix" class="btn">Compute</button>
  <div class="result-box" id="p-mix-out"></div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/calculators/psychro.js"></script>
{% endblock %}
