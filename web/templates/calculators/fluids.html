{% extends "base.html" %}
{% block title %}Fluid Mechanics · MELE Review{% endblock %}
{% block content %}
<div class="container narrow">
  <a href="/calculators" class="back-link">&larr; Calculators</a>
  <h1>Pipe Flow</h1>
  <div class="form-group"><label>Flow rate Q (m³/s)</label><input type="number" id="f-q" step="any" value="0.01"></div>
  <div class="form-group"><label>Pipe diameter D (m)</label><input type="number" id="f-d" step="any" value="0.1"></div>
  <div class="form-group"><label>Fluid density ρ (kg/m³)</label><input type="number" id="f-rho" step="any" value="1000"></div>
  <div class="form-group"><label>Dynamic viscosity μ (Pa·s)</label><input type="number" id="f-mu" step="any" value="0.001"></div>
  <div class="form-group"><label>Pipe length L (m)</label><input type="number" id="f-l" step="any" value="100"></div>
  <div class="form-group"><label>Roughness ε (m, steel ≈ 0.000046)</label><input type="number" id="f-eps" step="any" value="0.000046"></div>
  <div class="form-group"><label>Pump efficiency η (0–1)</label><input type="number" id="f-eff" step="any" value="0.7"></div>
  <button id="f-calc" class="btn">Compute</button>
  <div class="result-box" id="f-result"></div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/calculators/fluids.js"></script>
{% endblock %}
