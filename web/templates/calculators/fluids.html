{% extends "base.html" %}
{% block title %}Fluid Mechanics · MELE Review{% endblock %}
{% block content %}
<div class="container narrow">
  <a href="/calculators" class="back-link">&larr; Calculators</a>
  <h1>Pipe Flow</h1>
  <div class="form-group"><label>Flow rate Q (m³/s)</label><input type="number" id="f-q" step="any" value="0.01"></div>
  <div class="form-group"><label>Pipe diameter D (m)</label><input type="number" id="f-d" step="any" value="0.1"></div>
  <div class="form-group"><label>Fluid density ρ (kg/m³)</label><input type="number" id="f-rho" step="any" value="1000"></div>
  <div class="form-group"><label>Dynamic viscosity μ (Pa·s)</label><input type="number" id="f-mu" step="any" value="0.001"></div>
  <div class="form-group"><label>Pipe length L (m)</label><input type="number" id="f-l" step="any" value="100"></div>
  <div class="form-group"><label>Roughness ε (m, steel ≈ 0.000046)</label><input type="number" id="f-eps" step="any" value="0.000046"></div>
  <div class="form-group"><label>Pump efficiency η (0–1)</label><input type="number" id="f-eff" step="any" value="0.7"></div>
  <button id="f-calc" class="btn">Compute</button>
  <div class="result-box" id="f-result"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
  function fric(f, Re, eps, D) {
    // Swamee–Jain approximation for Darcy friction factor
    return 0.25 / Math.pow(Math.log10(eps / (3.7 * D) + 5.74 / Math.pow(Re, 0.9)), 2);
  }
  document.getElementById("f-calc").onclick = () => {
    const Q = +document.getElementById("f-q").value;
    const D = +document.getElementById("f-d").value;
    const rho = +document.getElementById("f-rho").value;
    const mu = +document.getElementById("f-mu").value;
    const L = +document.getElementById("f-l").value;
    const eps = +document.getElementById("f-eps").value;
    const eff = +document.getElementById("f-eff").value;

    const A = Math.PI * D * D / 4;
    const V = Q / A;
    const Re = rho * V * D / mu;
    const f = Re > 2000 ? fric(f, Re, eps, D) : 64 / Re; // laminar
    const hl = f * L / D * V * V / (2 * 9.81);
    const hpump = (hl + V * V / (2 * 9.81)) / eff;
    const P = rho * 9.81 * Q * hpump;

    document.getElementById("f-result").innerHTML = `
      <table class="out-table">
        <tr><td>Velocity</td><td>${V.toFixed(3)} m/s</td></tr>
        <tr><td>Reynolds number</td><td>${Re.toFixed(0)} (${Re < 2300 ? "laminar" : Re < 4000 ? "transition" : "turbulent"})</td></tr>
        <tr><td>Friction factor f</td><td>${f.toFixed(4)}</td></tr>
        <tr><td>Head loss</td><td>${hl.toFixed(3)} m</td></tr>
        <tr><td>Pump power</td><td>${P.toFixed(1)} W (${(P / 745.7).toFixed(3)} hp)</td></tr>
      </table>`;
  };
</script>
{% endblock %}
