{% extends "base.html" %}
{% block title %}Unit Converter · MELE Review{% endblock %}
{% block content %}
<div class="container narrow">
  <a href="/calculators" class="back-link">&larr; Calculators</a>
  <h1>Unit Converter</h1>
  <div class="form-group">
    <label>Quantity</label>
    <select id="u-cat"></select>
  </div>
  <div class="form-group">
    <label>Value</label>
    <input type="number" id="u-value" step="any" value="1">
  </div>
  <div class="form-group"><label>From</label><select id="u-from"></select></div>
  <div class="form-group"><label>To</label><select id="u-to"></select></div>
  <button id="u-convert" class="btn">Convert</button>
  <div class="result-box" id="u-result"></div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/calculators/unit.js"></script>
{% endblock %}
