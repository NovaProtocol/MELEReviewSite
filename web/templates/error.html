{% extends "base.html" %}
{% block title %}{{ code }} {{ title }} · MELE Review{% endblock %}
{% block content %}
<div class="container" style="min-height: calc(100vh - 320px); display:flex; align-items:center; justify-content:center; padding:2rem;">
  <div class="q-card" style="max-width:520px; width:100%; text-align:center;">
    <div style="font-size:4.5rem; font-weight:800; line-height:1; color: var(--accent);">{{ code }}</div>
    <h2 style="margin:.6rem 0;">{{ title }}</h2>
    <p class="muted">{{ message }}</p>
    <a href="/" class="btn btn-primary" style="margin-top:1rem;">Back to Home</a>
  </div>
</div>
{% endblock %}
