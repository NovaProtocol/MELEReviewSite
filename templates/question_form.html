{% extends "base.html" %}
{% block title %}Add Question — MELE Review{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-6">
        <a href="/sources/{{ source.id }}" class="text-text-secondary hover:text-accent text-sm mb-1 inline-block">&larr; {{ source.title }}</a>
        <h1 class="text-2xl font-bold">Add Question</h1>
        <p class="text-text-secondary text-sm">Add a question manually. Leave answer blank if unknown.</p>
    </div>

    <form method="POST" action="/sources/{{ source.id }}/questions/new" class="bg-bg-card border border-border rounded-xl p-5 space-y-4">
        <div>
            <label for="question_text" class="block text-sm text-text-secondary mb-1">Question</label>
            <textarea name="question_text" id="question_text" required rows="3"
                class="w-full px-4 py-2.5 rounded-lg bg-bg-secondary border border-border text-text-primary placeholder-text-secondary focus:border-accent focus:outline-none"></textarea>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label for="choice_a" class="block text-sm text-text-secondary mb-1">Choice A</label>
                <input type="text" name="choice_a" id="choice_a" required
                    class="w-full px-4 py-2.5 rounded-lg bg-bg-secondary border border-border text-text-primary placeholder-text-secondary focus:border-accent focus:outline-none">
            </div>
            <div>
                <label for="choice_b" class="block text-sm text-text-secondary mb-1">Choice B</label>
                <input type="text" name="choice_b" id="choice_b" required
                    class="w-full px-4 py-2.5 rounded-lg bg-bg-secondary border border-border text-text-primary placeholder-text-secondary focus:border-accent focus:outline-none">
            </div>
            <div>
                <label for="choice_c" class="block text-sm text-text-secondary mb-1">Choice C</label>
                <input type="text" name="choice_c" id="choice_c" required
                    class="w-full px-4 py-2.5 rounded-lg bg-bg-secondary border border-border text-text-primary placeholder-text-secondary focus:border-accent focus:outline-none">
            </div>
            <div>
                <label for="choice_d" class="block text-sm text-text-secondary mb-1">Choice D</label>
                <input type="text" name="choice_d" id="choice_d" required
                    class="w-full px-4 py-2.5 rounded-lg bg-bg-secondary border border-border text-text-primary placeholder-text-secondary focus:border-accent focus:outline-none">
            </div>
            <div>
                <label for="choice_e" class="block text-sm text-text-secondary mb-1">Choice E <span class="text-text-secondary/50">(optional)</span></label>
                <input type="text" name="choice_e" id="choice_e"
                    class="w-full px-4 py-2.5 rounded-lg bg-bg-secondary border border-border text-text-primary placeholder-text-secondary focus:border-accent focus:outline-none">
            </div>
            <div>
                <label for="answer" class="block text-sm text-text-secondary mb-1">Answer <span class="text-text-secondary/50">(A–E)</span></label>
                <select name="answer" id="answer"
                    class="w-full px-4 py-2.5 rounded-lg bg-bg-secondary border border-border text-text-primary focus:border-accent focus:outline-none">
                    <option value="">Unknown</option>
                    <option value="1">A</option>
                    <option value="2">B</option>
                    <option value="3">C</option>
                    <option value="4">D</option>
                    <option value="5">E</option>
                </select>
            </div>
        </div>
        <div class="flex gap-3 pt-2">
            <a href="/sources/{{ source.id }}" class="flex-1 text-center px-4 py-2 rounded-lg border border-border text-text-secondary hover:text-text-primary transition">Cancel</a>
            <button type="submit" class="flex-1 px-4 py-2 rounded-lg bg-accent text-bg-primary font-semibold hover:opacity-90 transition">Add Question</button>
        </div>
    </form>
</div>
{% endblock %}
