<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MELE Review{% endblock %}</title>
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bg: { primary: '#0a0a0f', secondary: '#12121a', card: '#1a1a28' },
                        border: '#2a2a3e',
                        accent: '#64ffda',
                        'accent-dim': 'rgba(100, 255, 218, 0.1)',
                        text: { primary: '#e8e8f0', secondary: '#8888a0' },
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <!-- MathQuill (Desmos fork) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@desmos-community/mathquill@2026.8.7/dist/style.css">
    {% block head_extra %}{% endblock %}
    <style>
        body { font-family: 'Inter', sans-serif; background: #0a0a0f; color: #e8e8f0; }
        .katex { font-size: 1.1em; }
        .mq-editable-field { background: #1a1a2e; border: 1px solid #2a2a3e; border-radius: 8px; padding: 2px 8px; }
        .mq-editable-field.mq-focused { border-color: #64ffda; box-shadow: 0 0 0 2px rgba(100, 255, 218, 0.2); }
        .mq-math-mode .mq-root-block, .mq-math-mode { color: #e8e8f0; }
        .choice-btn { transition: all 0.2s; border-color: #2a2a3e; background: transparent; }
        .choice-btn:hover { transform: translateY(-1px); }
        .choice-btn:focus, .choice-btn:focus-visible { outline: none; box-shadow: none; }
        .choice-btn.selected { border-color: #64ffda; background: rgba(100, 255, 218, 0.1); }
        .choice-btn.correct { border-color: #4ade80; background: rgba(74, 222, 128, 0.15); }
        .choice-btn.incorrect { border-color: #f87171; background: rgba(248, 113, 113, 0.15); }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .scrollbar-thin::-webkit-scrollbar { width: 6px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: #12121a; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #2a2a3e; border-radius: 3px; }
    </style>
    {% block stylesheets %}{% endblock %}
</head>
<body class="min-h-screen bg-bg-primary text-text-primary">
    <nav class="border-b border-border bg-bg-secondary/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/" class="text-xl font-bold text-accent">MELE<span class="text-text-secondary font-normal">Review</span></a>
            <div class="flex items-center gap-4">
                <a href="/sources" class="text-text-secondary hover:text-text-primary transition text-sm">Sources</a>
                {% if write_mode %}
                <span class="text-xs px-2 py-1 rounded-full bg-accent/10 text-accent font-mono">WRITE</span>
                <a href="/auth/logout" class="text-xs text-text-secondary hover:text-red-400 transition">Logout</a>
                {% else %}
                <button onclick="document.getElementById('loginModal').classList.remove('hidden')" class="text-xs px-3 py-1.5 rounded-full border border-border hover:border-accent hover:text-accent transition">Write Access</button>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Login Modal -->
    <div id="loginModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center">
        <div class="bg-bg-card border border-border rounded-2xl p-6 w-full max-w-sm mx-4">
            <h3 class="text-lg font-semibold mb-4">Write Access</h3>
            <form method="POST" action="/auth/login">
                <input type="password" name="access_password" placeholder="Enter access password" class="w-full px-4 py-2.5 rounded-lg bg-bg-secondary border border-border text-text-primary placeholder-text-secondary focus:border-accent focus:outline-none mb-4">
                <div class="flex gap-3">
                    <button type="button" onclick="document.getElementById('loginModal').classList.add('hidden')" class="flex-1 px-4 py-2 rounded-lg border border-border text-text-secondary hover:text-text-primary transition">Cancel</button>
                    <button type="submit" class="flex-1 px-4 py-2 rounded-lg bg-accent text-bg-primary font-semibold hover:opacity-90 transition">Login</button>
                </div>
            </form>
        </div>
    </div>

    <main class="max-w-6xl mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-border py-6 mt-12">
        <div class="max-w-6xl mx-auto px-4 text-center text-text-secondary text-sm">
            MELE Review — Board Exam Reviewer
        </div>
    </footer>

    <!-- KaTeX auto-render -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <!-- MathQuill (Desmos fork) -->
    <script src="https://cdn.jsdelivr.net/npm/@desmos-community/mathquill@2026.8.7/dist/index.global.js"></script>
    <!-- math.js -->
    <script src="https://cdn.jsdelivr.net/npm/mathjs@12.4.0/lib/browser/math.js"></script>
    <!-- pdf.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false},
                ],
                throwOnError: false
            });
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
