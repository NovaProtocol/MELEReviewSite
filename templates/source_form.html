{% extends "base.html" %}
{% block title %}Upload Source — MELE Review{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
    <div class="mb-6">
        <a href="/sources" class="text-text-secondary hover:text-accent text-sm mb-1 inline-block">&larr; Sources</a>
        <h1 class="text-2xl font-bold">Upload Source</h1>
        <p class="text-text-secondary text-sm">Upload a PDF source, then add its questions.</p>
    </div>

    {% if error %}
    <div class="mb-4 p-3 rounded-lg bg-red-500/10 border border-red-500/30 text-sm text-red-200">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/sources/new" enctype="multipart/form-data" class="bg-bg-card border border-border rounded-xl p-5 space-y-4">
        <div>
            <label for="title" class="block text-sm text-text-secondary mb-1">Title</label>
            <input type="text" name="title" id="title" value="{{ title or '' }}"
                class="w-full px-4 py-2.5 rounded-lg bg-bg-secondary border border-border text-text-primary placeholder-text-secondary focus:border-accent focus:outline-none"
                placeholder="e.g. IBONG TIRIRIT (MATH 1)">
        </div>
        <div>
            <label for="file" class="block text-sm text-text-secondary mb-1">PDF File</label>
            <input type="file" name="file" id="file" accept="application/pdf" required
                class="w-full px-4 py-2.5 rounded-lg bg-bg-secondary border border-border text-text-secondary focus:border-accent focus:outline-none file:mr-4 file:px-3 file:py-1.5 file:rounded-lg file:border-0 file:bg-accent/10 file:text-accent file:text-sm file:font-medium">
        </div>
        <div class="flex gap-3 pt-2">
            <a href="/sources" class="flex-1 text-center px-4 py-2 rounded-lg border border-border text-text-secondary hover:text-text-primary transition">Cancel</a>
            <button type="submit" class="flex-1 px-4 py-2 rounded-lg bg-accent text-bg-primary font-semibold hover:opacity-90 transition">Upload</button>
        </div>
    </form>
</div>
{% endblock %}
