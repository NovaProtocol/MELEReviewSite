site_name: MELE Review · Documentation
site_description: Documentation for MELE Review — board-exam reviewer for Philippine Mechanical Engineering licensure exams
site_author: MELE Review
repo_url: https://github.com/NovaProtocol/MELEReviewSite
repo_name: NovaProtocol/MELEReviewSite
edit_uri: edit/main/documentation/docs/

theme:
  name: material
  palette:
    primary: custom
    accent: custom
  icon:
    repo: fontawesome/brands/github
  font:
    text: Segoe UI
    code: Cascadia Code
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra:
  generator: false

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.emoji
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - glightbox

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Questions:
      - questions/index.md
  - Blocks:
      - blocks/index.md
  - Solver:
      - solver/index.md
  - API Reference:
      - api/index.md
  - Docker Infrastructure:
      - docker/index.md
