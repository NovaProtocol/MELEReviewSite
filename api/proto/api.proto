syntax = "proto3";

package melereview;

// Review service is the internal gRPC interface for web -> api.
// HTTP remains the public interface via caddy (port 7060 -> 8082/8081).
// gRPC is container-to-container only: expose 50051 on melereview_api, no ports.
service Review {
  // Question operations
  rpc GetQuestions (Empty) returns (QuestionList);
  rpc GetQuestion (GetQuestionRequest) returns (Question);
  rpc ListTags (Empty) returns (TagList);
  rpc HealthCheck (Empty) returns (HealthResponse);
}

message Empty {}

message Question {
  int32 id = 1;
  string question_text = 2;
  string choice_a = 3;
  string choice_b = 4;
  string choice_c = 5;
  string choice_d = 6;
  // optional 5th choice
  string choice_e = 7;
  int32 answer = 8;
  string solution = 9;
  bool flagged = 10;
  bool active = 11;
  int32 account_id = 12;
  string author_name = 13;
  repeated string tags = 14;
  string date_created = 15;
}

message QuestionList {
  repeated Question questions = 1;
}

message GetQuestionRequest {
  int32 id = 1;
}

message Tag {
  int32 id = 1;
  string name = 2;
}

message TagList {
  repeated Tag tags = 1;
}

message HealthResponse {
  string status = 1;
}
