[project]
name = "melereview"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [] # runtime deps live in requirements.txt for Docker

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx",
    "aiosqlite",
    "ruff>=0.14",
    "mypy>=1.16",
    "pre-commit",
    "pytest-asyncio",
    "pydantic-settings>=2",
    "slowapi",
]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = ["documentation/site"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "B023", "B904"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E501", "SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.14"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = "documentation/site"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "CoolProp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.thermo.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
