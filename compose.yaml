name: melereview

services:
  melereview_api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: melereview_api
    restart: unless-stopped
    environment:
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE:?DEPLOYMENT_TYPE is required}
      MYSQL_HOST: mysql-db
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASS: ${MYSQL_PASS:?MYSQL_PASS is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-MELEReview}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
    depends_on:
      mysql-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 512m
    cpus: "1.0"
    networks:
      - default

  melereview_web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: melereview_web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    cpus: "0.5"
    networks:
      - default

  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    container_name: melereview_caddy
    restart: unless-stopped
    ports:
      - "127.0.0.1:7060:7060"
    networks:
      - default
      - gatekeeper
      - cloudflared-tunnel

  mysql-db:
    image: mysql:8.4
    container_name: melereview_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASS:?MYSQL_PASS is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-MELEReview}
    volumes:
      - mysql_data:/var/lib/mysql
    command: --max_connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

volumes:
  mysql_data:

networks:
  default:
  gatekeeper:
    external: true
    name: gatekeeper_default
  cloudflared-tunnel:
    external: true
    name: cloudflared-tunnel_default
