name: melereview

services:
  melereview_main:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: melereview_main
    restart: unless-stopped
    environment:
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE:?DEPLOYMENT_TYPE is required}
      MYSQL_HOST: mysql-db
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASS: ${MYSQL_PASS:?MYSQL_PASS is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-MELEReview}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ADMIN_USER: ${ADMIN_USER:?ADMIN_USER is required}
      ADMIN_PASS: ${ADMIN_PASS:?ADMIN_PASS is required}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-8388608}
      MAX_MEDIA_BYTES: ${MAX_MEDIA_BYTES:-8388608}
      MEDIA_MAX_EDGE: ${MEDIA_MAX_EDGE:-1600}
      MEDIA_SWEEP_HOURS: ${MEDIA_SWEEP_HOURS:-6}
      MEDIA_GRACE_HOURS: ${MEDIA_GRACE_HOURS:-24}
      MAX_OPEN_INVITES: ${MAX_OPEN_INVITES:-5}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql-db:
        condition: service_healthy
    expose:
      - "7061"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:7061/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 768m
    cpus: "1.0"
    networks:
      - default

  melereview_documentation:
    build:
      context: .
      dockerfile: documentation/Dockerfile
    container_name: melereview_documentation
    restart: unless-stopped
    expose:
      - "8005"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8005/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    networks:
      - default

  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    container_name: melereview_caddy
    restart: unless-stopped
    ports:
      - "127.0.0.1:7060:7060"
    depends_on:
      - melereview_main
    mem_limit: 128m
    networks:
      - default
      - gatekeeper

  mysql-db:
    image: mysql:8.4
    container_name: melereview_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASS:?MYSQL_PASS is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-MELEReview}
    volumes:
      - mysql_data:/var/lib/mysql
    command: --max_connections=200 --max_allowed_packet=16M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    networks:
      - default

volumes:
  mysql_data:
  uploads_data:

networks:
  default:
  gatekeeper:
    external: true
    name: gatekeeper
