<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MELE Review</title>
    <script>
      /* The theme is chosen once for the whole site and stored under one key; the
         workspace must open in the same one rather than flashing its own. */
      (function () {
        var saved = localStorage.getItem("ui-theme");
        var theme =
          saved ||
          (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark");
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
