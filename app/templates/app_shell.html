<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f9e8f'/%3E%3Ctext x='16' y='23' font-family='system-ui' font-size='18' font-weight='700' text-anchor='middle' fill='white'%3EM%3C/text%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workspace · MELE Review</title>
  <link rel="preconnect" href="https://cdn.projectnova.download" crossorigin>
  <link rel="stylesheet" href="https://cdn.projectnova.download/flat/dark/theme.css?v=8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  {% if bundle.css %}<link rel="stylesheet" href="/static/app/{{ bundle.css }}">{% endif %}
  <script>
    /* The theme is chosen once for the whole site and stored under one key; the
       workspace must open in the same one rather than flashing its own. */
    (function () {
      var saved = localStorage.getItem("ui-theme");
      var theme =
        saved ||
        (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
          ? "light"
          : "dark");
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body>
<div id="root"></div>
<script>
  /* The chrome's payload: who is here, what can be spawned, where the library is. */
  window.__MELE__ = {{ bootstrap|tojson }};
</script>
{% if bundle.js %}
<script type="module" src="/static/app/{{ bundle.js }}"></script>
{% else %}
<p style="font-family: sans-serif; padding: 2rem">
  The workspace bundle has not been built. Run <code>npm --prefix frontend run build</code>.
</p>
{% endif %}
</body>
</html>
