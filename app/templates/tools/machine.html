{% extends "tools/_embed.html" %}

{% block tool_content %}
<h2 class="tool-section">Gear ratio</h2>
<div class="row2">
  <div class="field"><label for="g-driver">Driver teeth</label><input type="number" id="g-driver" step="any" value="20"></div>
  <div class="field"><label for="g-driven">Driven teeth</label><input type="number" id="g-driven" step="any" value="60"></div>
</div>
<div class="field"><label for="g-rpm">Driver speed (rpm)</label><input type="number" id="g-rpm" step="any" value="1800"></div>
<button id="g-gear" class="btn btn-block">Compute</button>
<div class="result-box" id="g-gear-out"></div>

<h2 class="tool-section">Belt drive</h2>
<div class="row2">
  <div class="field"><label for="bt-d1">Driver pulley D₁ (mm)</label><input type="number" id="bt-d1" step="any" value="100"></div>
  <div class="field"><label for="bt-d2">Driven pulley D₂ (mm)</label><input type="number" id="bt-d2" step="any" value="250"></div>
</div>
<div class="field"><label for="bt-rpm">Driver speed (rpm)</label><input type="number" id="bt-rpm" step="any" value="1500"></div>
<button id="bt-belt" class="btn btn-block">Compute</button>
<div class="result-box" id="bt-belt-out"></div>

<h2 class="tool-section">Power transmission</h2>
<div class="row2">
  <div class="field"><label for="pw-t">Torque (N m)</label><input type="number" id="pw-t" step="any" value="300"></div>
  <div class="field"><label for="pw-rpm">Speed (rpm)</label><input type="number" id="pw-rpm" step="any" value="1200"></div>
</div>
<button id="pw-power" class="btn btn-block">Compute</button>
<div class="result-box" id="pw-power-out"></div>
{% endblock %}

{% block tool_scripts %}
<script src="/static/js/calculators/machine.js"></script>
{% endblock %}
