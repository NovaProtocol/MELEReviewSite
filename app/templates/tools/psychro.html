{% extends "tools/_embed.html" %}

{% block tool_content %}
<div class="row2">
  <div class="field"><label for="p-t">Dry-bulb T (°C)</label><input type="number" id="p-t" step="any" value="30"></div>
  <div class="field"><label for="p-rh">Relative humidity (%)</label><input type="number" id="p-rh" step="any" value="60"></div>
</div>
<div class="field"><label for="p-p">Pressure (kPa, ≈101.325)</label><input type="number" id="p-p" step="any" value="101.325"></div>
<button id="p-calc" class="btn btn-block">Compute</button>
<div class="result-box" id="p-result"></div>

<h2 class="tool-section">Mixing two air streams</h2>
<div class="row2">
  <div class="field"><label for="m1">Stream 1: m₁ (kg/s), T₁ (°C)</label><input type="text" id="m1" value="2, 25"></div>
  <div class="field"><label for="m2">Stream 2: m₂ (kg/s), T₂ (°C)</label><input type="text" id="m2" value="3, 35"></div>
</div>
<button id="p-mix" class="btn btn-block">Compute</button>
<div class="result-box" id="p-mix-out"></div>
{% endblock %}

{% block tool_scripts %}
<script src="/static/js/calculators/psychro.js"></script>
{% endblock %}
