{% extends "tools/_embed.html" %}

{% block tool_content %}
<div class="field"><label for="f-q">Flow rate Q (m³/s)</label><input type="number" id="f-q" step="any" value="0.01"></div>
<div class="field"><label for="f-d">Pipe diameter D (m)</label><input type="number" id="f-d" step="any" value="0.1"></div>
<div class="field"><label for="f-rho">Fluid density ρ (kg/m³)</label><input type="number" id="f-rho" step="any" value="1000"></div>
<div class="field"><label for="f-mu">Dynamic viscosity μ (Pa s)</label><input type="number" id="f-mu" step="any" value="0.001"></div>
<div class="field"><label for="f-l">Pipe length L (m)</label><input type="number" id="f-l" step="any" value="100"></div>
<div class="field"><label for="f-eps">Roughness ε (m, steel ≈ 0.000046)</label><input type="number" id="f-eps" step="any" value="0.000046"></div>
<div class="field"><label for="f-eff">Pump efficiency η (0 to 1)</label><input type="number" id="f-eff" step="any" value="0.7"></div>
<button id="f-calc" class="btn btn-primary btn-block">Compute</button>
<div class="result-box" id="f-result"></div>
{% endblock %}

{% block tool_scripts %}
<script src="/static/js/calculators/fluids.js"></script>
{% endblock %}
