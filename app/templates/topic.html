{% extends "_topic.html" %}
{% block title %}{{ topic.name }} · MELE Review{% endblock %}

{% block problems %}
<div class="q-toolbar">
  <input type="search" id="q-search" placeholder="Search" aria-label="Search questions">
  <select id="q-sort" aria-label="Sort questions">
    <option value="newest">Newest first</option>
    <option value="oldest">Oldest first</option>
    <option value="score">Highest score</option>
    <option value="downvoted">Lowest score</option>
    <option value="answered">Most answered</option>
    <option value="unsolved">Least solved</option>
  </select>

  <div class="filter-menu" id="filter-menu">
    <button type="button" class="btn btn-outline filter-btn" id="filter-toggle"
            aria-expanded="false" aria-controls="filter-panel">
      <svg class="icon"><use href="#i-filter"/></svg> Filters<span class="filter-btn__count" id="filter-count" hidden>0</span>
    </button>
    <div class="filter-panel" id="filter-panel" hidden>
      <div class="filter-panel__row">
        <label for="f-answered">Answers</label>
        <select id="f-answered">
          <option value="all">Show all</option>
          <option value="answered">Answered only</option>
          <option value="unanswered">Unanswered only</option>
        </select>
      </div>
      <label class="filter-check"><input type="checkbox" id="f-favourites"> Favourites</label>
      <label class="filter-check"><input type="checkbox" id="f-hidden"> Hidden</label>
      <label class="filter-check"><input type="checkbox" id="f-downvoted"> Downvoted</label>
      <div class="filter-panel__row">
        <label for="f-kind">Kind</label>
        <select id="f-kind">
          <option value="">Any kind</option>
          <option value="identification">Identification</option>
          <option value="computation">Computation</option>
        </select>
      </div>
      <label class="filter-check"><input type="checkbox" id="f-solution"> Has a solution</label>
      <label class="filter-check"><input type="checkbox" id="f-mine"> Mine</label>
      <button type="button" class="btn btn-sm filter-reset" id="filter-reset">Reset</button>
    </div>
  </div>

  <span class="muted" id="q-count"></span>
</div>

<div class="q-list" id="q-list" data-topic="{{ topic.id }}"
     data-can-moderate="{{ '1' if permissions.has(viewer.permissions, permissions.MODERATE) else '0' }}">
  <p class="muted">Loading questions...</p>
</div>
{% endblock %}

{% block topic_scripts %}
<script src="/static/js/card.js?v=5"></script>
<script src="/static/js/topic.js?v=4"></script>
{% endblock %}
